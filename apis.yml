name: The Ladders
description: >-
  Ladders (TheLadders.com) is a New York City based online job-search service
  founded in 2003 by Marc Cenedella that specializes in vetted executive and
  professional roles paying $100,000 or more per year. The subscription platform
  pairs a curated $100K+ job board with recruiter access, resume review and
  rewrite tools, AI-powered resume and LinkedIn optimization, and a daily
  career-news and advice product (Ladders News). It runs a consumer-facing web
  application with free Basic and paid Premium memberships and, as of this
  profile, publishes no public developer API, OpenAPI, or partner integration
  program.
